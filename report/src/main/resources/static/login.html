<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background: #f3f4f6;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .card {
          width: 360px;
          background: white;
          padding: 28px;
          border-radius: 16px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h2 {
          margin-top: 0;
          color: #111827;
        }

        input {
          width: 100%;
          height: 42px;
          margin-top: 12px;
          padding: 0 12px;
          border: 1px solid #d1d5db;
          border-radius: 10px;
          box-sizing: border-box;
        }

        button {
          width: 100%;
          height: 42px;
          margin-top: 16px;
          border: none;
          border-radius: 10px;
          background: #2563eb;
          color: white;
          font-weight: bold;
          cursor: pointer;
        }

        .error {
          margin-top: 12px;
          color: #dc2626;
          font-size: 14px;
          display: none;
        }
    </style>
    <link rel="stylesheet" href="/css/app-theme.css" />
</head>
<body>

<div class="card">
    <h2>Login</h2>

    <input id="username" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button id="loginButton" onclick="login()">Login</button>

    <div id="error" class="error"></div>
</div>

<script>
    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
    }

    function hideError() {
      document.getElementById("error").style.display = "none";
    }

    function setLoading(loading) {
      const button = document.getElementById("loginButton");
      button.disabled = loading;
      button.textContent = loading ? "Logging in..." : "Login";
    }

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      hideError();
      if (!username || !password) {
        showError("Please enter your username and password.");
        return;
      }

      setLoading(true);
      try {
        const res = await fetch(`/api/users/login?username=${encodeURIComponent(username)}`, {
          method: "GET",
          headers: {
            "X-Password": password
          }
        });

        if (!res.ok) {
          let message = "Invalid username or password.";
          try {
            const errorBody = await res.json();
            message = errorBody.detail || errorBody.message || message;
          } catch (_) {
            // Keep the generic login error when the backend has no JSON body.
          }
          throw new Error(message);
        }

        const user = await res.json();
        if (!user || !user.id || user.status !== true) {
          throw new Error("This user account is inactive.");
        }

        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", JSON.stringify(user));
        window.location.href = "/item.html";
      } catch (error) {
        console.error(error);
        showError(error.message || "Unable to log in.");
      } finally {
        setLoading(false);
      }
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        login();
      }
    });
</script>

</body>
</html>
