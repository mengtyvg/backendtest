<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment History</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f0f2f5; color: #111827; min-height: 100vh; }
    .topnav { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 20px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .brand { font-size: 14px; font-weight: 800; color: #16a34a; }
    nav { display: flex; gap: 4px; }
    nav a { color: #6b7280; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
    nav a.active { color: #16a34a; background: #f0fdf4; font-weight: 700; }
    .page { padding: 18px 20px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .title { font-size: 18px; font-weight: 800; }
    .subtitle { margin-top: 3px; font-size: 12px; color: #6b7280; }
    .refresh { height: 34px; border: 1px solid #16a34a; border-radius: 7px; background: #16a34a; color: #fff; padding: 0 13px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; background: #f9fafb; color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding: 11px 14px; border-bottom: 1px solid #e5e7eb; }
    td { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; color: #374151; font-size: 13px; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .amount { font-weight: 900; color: #111827; }
    .hash { max-width: 220px; overflow-wrap: anywhere; color: #6b7280; font-size: 11px; }
    .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 900; background: #fef9c3; color: #854d0e; }
    .pill.PAID { background: #dcfce7; color: #15803d; }
    .pill.EXPIRED { background: #fee2e2; color: #b91c1c; }
    .empty { padding: 42px 16px; text-align: center; color: #9ca3af; font-size: 13px; }
    @media (max-width: 760px) {
      .topnav { align-items: flex-start; height: auto; flex-direction: column; padding: 12px 16px; gap: 8px; }
      nav { flex-wrap: wrap; }
      .page { padding: 14px; }
      .card { overflow-x: auto; }
      table { min-width: 760px; }
    }
  </style>
  <link rel="stylesheet" href="/css/app-theme.css" />
</head>
<body>
<div class="topnav">
  <div class="brand">monakom</div>
  <nav>
    <a href="/sale.html">Sales</a>
    <a href="/payment-method.html">Payment Methods</a>
    <a class="active" href="/payment-history.html">Payments</a>
    <a href="/users.html">Users</a>
  </nav>
</div>

<main class="page">
  <div class="header">
    <div>
      <div class="title">Payment History</div>
      <div class="subtitle">Recent Bakong/KHQR payment requests and settlement status</div>
    </div>
    <button class="refresh" onclick="loadPayments()">Refresh</button>
  </div>

  <div class="card">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Created</th>
        <th>Expires</th>
        <th>Paid</th>
        <th>Bakong Hash</th>
      </tr>
      </thead>
      <tbody id="paymentBody">
      <tr><td colspan="7" class="empty">Loading payments...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  function fmtDate(value) {
    if (!value) return "-";
    return new Date(value).toLocaleString();
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function loadPayments() {
    const body = document.getElementById("paymentBody");
    body.innerHTML = `<tr><td colspan="7" class="empty">Loading payments...</td></tr>`;

    try {
      const res = await fetch("/api/payments");
      if (!res.ok) throw new Error("Unable to load payments");
      const payments = await res.json();
      body.innerHTML = payments.map(payment => `
        <tr>
          <td>#${payment.paymentId}</td>
          <td class="amount">${escapeHtml(payment.currency)} ${Number(payment.amount || 0).toFixed(2)}</td>
          <td><span class="pill ${escapeHtml(payment.status)}">${escapeHtml(payment.status)}</span></td>
          <td>${fmtDate(payment.createdAt)}</td>
          <td>${fmtDate(payment.expiresAt)}</td>
          <td>${fmtDate(payment.paidAt)}</td>
          <td class="hash">${escapeHtml(payment.bakongHash || "-")}</td>
        </tr>
      `).join("") || `<tr><td colspan="7" class="empty">No payments found.</td></tr>`;
    } catch (error) {
      body.innerHTML = `<tr><td colspan="7" class="empty">${escapeHtml(error.message)}</td></tr>`;
    }
  }

  document.addEventListener("DOMContentLoaded", loadPayments);
</script>
</body>
</html>
